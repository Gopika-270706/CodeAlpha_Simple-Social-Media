<!DOCTYPE html>
<html>
<head>
    <title>Create Post</title>
</head>
<body>

    <h1>Create a New Post</h1>

    <form method="POST">
        {% csrf_token %}

        <textarea
            name="content"
            rows="5"
            placeholder="What's on your mind?"
        ></textarea>

        <br><br>

        <button type="submit">Post</button>
    </form>

    <br>

    <a href="{% url 'home' %}">Back to Home</a>

</body>
</html>
